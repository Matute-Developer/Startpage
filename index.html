<!DOCTYPE html>
<html lang="es">
   <head>
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta charset="UTF-8">
      <title>Inicio</title>
	  
      <script src="https://code.jquery.com/jquery-2.2.0.js"></script>
      <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
      <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>
      <link href='https://fonts.googleapis.com/css?family=Roboto' rel='stylesheet' type='text/css'>
      <link rel="stylesheet" href="./css/mobile.css">
   </head>
   <body>
      <img id="imagen" src="assets/enzo (2).jpeg" alt="Fondo de pantalla" preload="none">
	    <!-- particles.js container --> 
	   <div id="particles-js"></div> <!-- stats - count particles --> 
	   <div class="count-particles"> 
	   <span class="js-count-particles"></span></div> 
      <h1 id="clock"></h1>
       <div class="container">
         <div id="content" class="vcenter">
            <div id="motivationDiv"></div>
            <a class="weatherwidget-io" href="https://forecast7.com/es/n38d01n57d54/mar-del-plata/" data-label_1="Mardel" data-font="Roboto" data-icons="Climacons" data-mode="Current" data-theme="dark" data-basecolor="rgba(255, 255, 255, 0)" data-textcolor="#ffffff" data-mooncolor="#ffffff" data-cloudfill="rgba(255, 255, 255, 0.12)" >Mar del Plata</a>
            <script>
               !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
            </script>
            <div id="inputs">
				<div class="btn-group">
					<a class="btn btn-default" href="https://youtube.com">Youtube</a>
               <a class="btn btn-default" href="https://twitter.com">Twitter</a>
               <a class="btn btn-default" href="https://instagram.com">Instagram</a>
               <a class="btn btn-default" href="https://www.primevideo.com/region/na/storefront?ref_=atv_dp_tv_c_9zZ8D2_hom">Prime video</a>
               <a class="btn btn-default" href="https://mail.google.com/mail/u/0/?pli=1#inbox">Gmail</a>
               <a class="btn btn-default" href="https://www3.animeflv.net/">Anime</a>
               <a class="btn btn-default" href="https://ar.pinterest.com">Pinterest</a>
               <a class="btn btn-default" href="https://compragamer.com/?sort=lower_price&cate=38">CompraGamer</a>
				 </div>
               <form method="get" action="https://www.google.com/search">
                  <div class="input-group">
                     <input autofocus="autofocus" name="q" type="text" class="form-control" placeholder="Google" autofocus>
                     <span class="input-group-btn">
                     <button type="submit" class="btn btn-default">Search</button>
                     </span>
                  </div>
               </form>
			   <footer>
				de <a href="https://soypato.github.io">SoyPato</a>, Customizado por <a href="https://github.com/StrangeHuman-Developer">Mateo</a>
			</footer>
            </div>
         </div>
      </div>
      <aside id="image-config" class="image-config" aria-label="Configuración de la imagen de fondo">
         <button id="image-config-toggle" class="image-config__toggle" type="button" aria-expanded="false" aria-controls="image-config-panel"><span aria-hidden="true">⚙</span> Fondo</button>
         <div id="image-config-panel" class="image-config__panel">
            <label for="image-display">Visualización</label>
            <select id="image-display">
               <option value="center">Centrada</option>
               <option value="tile">Mosaico</option>
               <option value="contain">Ajustar a la página</option>
               <option value="cover">Ajustar todo</option>
            </select>
            <label for="image-opacity">Opacidad <output id="image-opacity-value" for="image-opacity">100%</output></label>
            <input id="image-opacity" type="range" min="0" max="100" value="100">
            <label for="image-position-x">Posición horizontal <output id="image-position-x-value" for="image-position-x">50%</output></label>
            <input id="image-position-x" type="range" min="0" max="100" value="50">
            <label for="image-position-y">Posición vertical <output id="image-position-y-value" for="image-position-y">50%</output></label>
            <input id="image-position-y" type="range" min="0" max="100" value="50">
            <label for="background-color">Color de fondo</label>
            <input id="background-color" type="color" value="#fefeff">
         </div>
      </aside>
      <script src="./js/index.js"></script>
   </body>
</html>
